<!DOCTYPE html>
<html>
<head>
  <title>Pure JS Interface</title>
</head>
<body>
  <script>
    const title = document.createElement('h1');
    title.textContent = 'All from JavaScript';
    const btn = document.createElement('button');
    btn.textContent = 'Click';
    btn.onclick = () => alert('Clicked!');
    document.body.append(title, btn);
  </script>
</body>
</html>
