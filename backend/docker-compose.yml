version: '3.8'

services:
  db:
    image: postgres:18
    container_name: quizbank-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: quizbank
    ports:
      - "5433:5432"
    volumes:
      - ./quizbank-db/db-init:/docker-entrypoint-initdb.d
      - quizbank_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: quizbank-api
    restart: always
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/quizbank
      PYTHONUNBUFFERED: 1
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "5001:5000"
    volumes:
      - .:/app
      - ./storage:/app/storage
    entrypoint: []
    command: sh -c "sleep 5 && uvicorn app.main:app --host 0.0.0.0 --port 5000 --reload"

volumes:
  quizbank_data: