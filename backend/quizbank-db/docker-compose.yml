version: "3.8"

services:
  db:
    image: postgres:18
    container_name: quizbank-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: quizbank
    ports:
      - "5433:5432"
    volumes:
      - ./db-init:/docker-entrypoint-initdb.d
      - quizbank_data:/var/lib/postgresql/data

volumes:
  quizbank_data:
