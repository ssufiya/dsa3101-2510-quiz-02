version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:13
    container_name: quizbank_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-quizbank}
    ports:
      - "${DB_EXTERNAL_PORT:-5433}:5432"
    volumes:
      # Persistent database data
      - postgres_data:/var/lib/postgresql/data
      # SQL schema files (for init_db.py to read)
      - ./backend/quizbank-db/db-init:/db-init:ro
      # Seed data (courses CSV and initial questions/contexts)
      - ./backend/quizbank-db/db-init/data:/db-seed/data:ro
      # Backup directory (shared with host for persistence)
      - ./backend/backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - quizbank-network

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: quizbank-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@db:5432/${DB_NAME:-quizbank}
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      PGPASSWORD: postgres
      DB_NAME: ${DB_NAME:-quizbank}
      PYTHONPATH: /app
      RESTORE_IF_BACKUP: ${RESTORE_IF_BACKUP:-1}
      SEED_FORCE: ${SEED_FORCE:-0}
    volumes:
      - ./backend/app:/app/app:ro
      - ./backend/quizbank-db/attachment_storage:/app/quizbank-db/attachment_storage:rw
      - ./backend/backups/quizbank:/app/backups/quizbank:rw
      - ./backend/backups/assets:/app/backups/assets:rw
      - ./backend/quizbank-db/db-init:/app/quizbank-db/db-init:ro
      - ./backend/quizbank-db/scripts:/app/quizbank-db/scripts
      - ./backend/quizbank-db/static:/app/quizbank-db/static:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - quizbank-network

  # Frontend
  frontend:
    build:
      context: ./frontend_landingpages/frontend_react
      dockerfile: Dockerfile
    container_name: quizbank-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    environment:
      - VITE_API_BASE_URL=http://backend:5000
    depends_on:
      - backend
    networks:
      - quizbank-network

volumes:
  postgres_data:

networks:
  quizbank-network:
    driver: bridge
